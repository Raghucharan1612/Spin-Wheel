<!DOCTYPE html>
<html lang="en" class="bg-background">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist — SpinWheel</title>
  <meta name="description" content="Your saved cars on SpinWheel — track price drops and compare your favourites in one place.">
  <meta name="theme-color" content="#06060a">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="nav-slot"></div>

  <section class="page-head">
    <div class="container container-xl">
      <span class="eyebrow reveal">My Garage</span>
      <h1 class="section-title reveal d1">Your Wishlist</h1>
      <p class="section-sub reveal d2">Saved cars, tracked price drops, and your shortlist — all in one place.</p>
    </div>
  </section>

  <section class="pb-5">
    <div class="container container-xl">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span style="color:var(--muted)"><b id="wishCount" style="color:var(--text)">0</b> saved cars</span>
        <button class="btn btn-ghost btn-pill" onclick="clearWishlist()"><i class="bi bi-trash3 me-1"></i>Clear All</button>
      </div>
      <div class="car-grid" id="wishGrid"></div>
      <div id="wishEmpty" class="text-center py-5" style="display:none">
        <i class="bi bi-heart" style="font-size:3.4rem;color:var(--muted-2)"></i>
        <h4 class="mt-3">Your wishlist is empty</h4>
        <p style="color:var(--muted)">Tap the heart on any car to save it here.</p>
        <a href="cars.html" class="btn btn-glow btn-pill px-4 mt-2"><i class="bi bi-car-front me-1"></i>Browse Cars</a>
      </div>
    </div>
  </section>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/wishlist.js"></script>
</body>
</html>
