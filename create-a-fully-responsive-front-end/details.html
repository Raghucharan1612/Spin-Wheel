<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Details | SpinWheel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="details">
  <header class="site-header">
    <nav class="navbar container" aria-label="Primary navigation">
      <a class="logo" href="index.html">SpinWheel</a>
      <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="nav-links"><a href="cars.html">Buy Cars</a><a href="compare.html">Compare</a><a href="sell.html">Sell Cars</a><a href="loans.html">Car Loan</a></div>
      <form class="nav-search" action="cars.html"><input type="search" placeholder="Search cars" aria-label="Search cars"></form>
      <div class="nav-actions"><select aria-label="Select city"><option>Bengaluru</option><option>Mumbai</option></select><a class="profile-button" href="login.html">Login</a></div>
    </nav>
  </header>

  <main class="page-shell container">
    <section class="details-top">
      <div class="gallery-panel">
        <img id="mainCarImage" class="main-car-image" src="" alt="" onerror="this.onerror=null;this.src='images/car-placeholder.jpg';">
        <div id="galleryThumbs" class="thumb-row"></div>
      </div>
      <aside class="details-summary">
        <div id="detailsHero"></div>
        <button id="bookDrive" class="button full-width" type="button">Book Test Drive</button>
      </aside>
    </section>

    <section class="details-grid">
      <article class="info-panel">
        <h2>Specifications</h2>
        <table class="spec-table"><tbody id="specsTable"></tbody></table>
      </article>
      <article class="info-panel">
        <h2>Features</h2>
        <ul id="featuresList" class="feature-list"></ul>
      </article>
      <article class="info-panel emi-panel">
        <h2>EMI calculator</h2>
        <label>Loan amount<input id="loanAmount" type="number" min="100000" step="10000"></label>
        <label>Tenure in months<input id="tenure" type="number" min="12" max="84" value="48"></label>
        <label>Interest rate %<input id="rate" type="number" min="6" max="18" step="0.1" value="10"></label>
        <div class="emi-result"><span>Estimated EMI</span><strong id="emiResult"></strong></div>
      </article>
    </section>

    <section class="section">
      <div class="section-heading split"><div><p class="eyebrow">Similar cars</p><h2>More cars you may like</h2></div><a class="text-link" href="cars.html">Browse all</a></div>
      <div id="similarCars" class="car-grid"></div>
    </section>
  </main>

  <footer class="site-footer compact"><div class="container footer-bottom">SpinWheel demo • <a href="index.html">Home</a> • <a href="cars.html">Buy cars</a> • <a href="sell.html">Sell</a> • <a href="loans.html">Loans</a></div></footer>
  <script src="js/cars.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
