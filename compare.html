<!DOCTYPE html>
<html lang="en" class="bg-background">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Cars — SpinWheel</title>
  <meta name="description" content="Compare used cars side by side on SpinWheel — price, specs, running costs and health scores at a glance.">
  <meta name="theme-color" content="#06060a">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="nav-slot"></div>

  <section class="page-head">
    <div class="container container-xl">
      <span class="eyebrow reveal">Compare</span>
      <h1 class="section-title reveal d1">Side-by-Side Showdown</h1>
      <p class="section-sub reveal d2">Pick up to three cars and let the numbers decide. Best value in each row is highlighted.</p>
    </div>
  </section>

  <section class="pb-5">
    <div class="container container-xl">
      <div class="glass p-3 p-md-4 mb-4 reveal">
        <div class="row g-3 align-items-end">
          <div class="col-md-4 col-12">
            <label class="d-block mb-1" style="font-size:.74rem;color:var(--muted-2)">SLOT 1</label>
            <select class="form-select cmp-select" data-slot="0" style="background:var(--surface-2);border:1px solid var(--stroke);color:var(--text)"></select>
          </div>
          <div class="col-md-4 col-12">
            <label class="d-block mb-1" style="font-size:.74rem;color:var(--muted-2)">SLOT 2</label>
            <select class="form-select cmp-select" data-slot="1" style="background:var(--surface-2);border:1px solid var(--stroke);color:var(--text)"></select>
          </div>
          <div class="col-md-4 col-12">
            <label class="d-block mb-1" style="font-size:.74rem;color:var(--muted-2)">SLOT 3</label>
            <select class="form-select cmp-select" data-slot="2" style="background:var(--surface-2);border:1px solid var(--stroke);color:var(--text)"></select>
          </div>
        </div>
      </div>

      <div class="table-responsive glass reveal" id="cmpWrap">
        <table class="compare-table" id="cmpTable"></table>
      </div>
    </div>
  </section>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/compare.js"></script>
</body>
</html>
