<!DOCTYPE html>
<html lang="en" class="bg-background">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Used Cars — SpinWheel</title>
  <meta name="description" content="Browse certified, 200-point inspected used cars on SpinWheel. Filter by brand, budget, fuel and transmission.">
  <meta name="theme-color" content="#06060a">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="nav-slot"></div>

  <section class="page-head">
    <div class="container container-xl">
      <span class="eyebrow reveal">Buy a Car</span>
      <h1 class="section-title reveal d1">Explore Certified Cars</h1>
      <p class="section-sub reveal d2">Every car is 200-point inspected, certified and ready to drive home.</p>
    </div>
  </section>

  <section class="pb-5">
    <div class="container container-xl">
      <!-- Filter bar -->
      <div class="glass p-3 p-md-4 mb-4 reveal">
        <div class="row g-3 align-items-end">
          <div class="col-md-3 col-6">
            <label class="d-block mb-1" style="font-size:.74rem;color:var(--muted-2)">BRAND</label>
            <select class="form-select" id="fBrand" style="background:var(--surface-2);border:1px solid var(--stroke);color:var(--text)"><option value="">All Brands</option></select>
          </div>
          <div class="col-md-3 col-6">
            <label class="d-block mb-1" style="font-size:.74rem;color:var(--muted-2)">FUEL</label>
            <select class="form-select" id="fFuel" style="background:var(--surface-2);border:1px solid var(--stroke);color:var(--text)"><option value="">Any</option><option>Petrol</option><option>Diesel</option></select>
          </div>
          <div class="col-md-3 col-6">
            <label class="d-block mb-1" style="font-size:.74rem;color:var(--muted-2)">TRANSMISSION</label>
            <select class="form-select" id="fTrans" style="background:var(--surface-2);border:1px solid var(--stroke);color:var(--text)"><option value="">Any</option><option>Automatic</option><option>Manual</option></select>
          </div>
          <div class="col-md-3 col-6">
            <label class="d-block mb-1" style="font-size:.74rem;color:var(--muted-2)">SORT</label>
            <select class="form-select" id="fSort" style="background:var(--surface-2);border:1px solid var(--stroke);color:var(--text)">
              <option value="match">Best Match</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Top Rated</option>
            </select>
          </div>
          <div class="col-12">
            <label class="d-block mb-2" style="font-size:.74rem;color:var(--muted-2)">MAX BUDGET: <span id="budgetLabel" style="color:var(--primary);font-weight:700"></span></label>
            <input type="range" id="fBudget" min="600000" max="4000000" step="50000" value="4000000">
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <span style="color:var(--muted)"><b id="resCount" style="color:var(--text)">0</b> cars found</span>
        <button class="btn btn-ghost btn-pill" onclick="resetFilters()"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset</button>
      </div>

      <div class="car-grid" id="carsGrid"></div>
      <div id="emptyState" class="text-center py-5" style="display:none">
        <i class="bi bi-search" style="font-size:3rem;color:var(--muted-2)"></i>
        <h4 class="mt-3">No cars match your filters</h4>
        <p style="color:var(--muted)">Try widening your budget or clearing filters.</p>
      </div>
    </div>
  </section>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/cars.js"></script>
</body>
</html>
